<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Route and seasonal terms in the log-demand model</title>
  <desc id="desc">Selected coefficients from the saved final linear model on log1p ticket sales. Train codes B, E, and G have negative coefficients; K and M positive. Reported seasonal terms are small.</desc>
  <rect width="1000" height="570" rx="18" fill="#f5f8fc"/>
  <text x="56" y="50" fill="#162b49" font-family="Arial, sans-serif" font-size="25" font-weight="700">Route and season terms in the demand model</text>
  <text x="56" y="79" fill="#62738a" font-family="Arial, sans-serif" font-size="15">Selected coefficients from the saved linear model · target is log(1 + seats)</text>
  <text x="60" y="116" fill="#344b68" font-family="Arial, sans-serif" font-size="14" font-weight="700">Train code</text>
  <text x="60" y="435" fill="#344b68" font-family="Arial, sans-serif" font-size="14" font-weight="700">Season</text>
  <g stroke="#dce4ee" stroke-width="1">
    <line x1="280" y1="128" x2="280" y2="486"/><line x1="400" y1="128" x2="400" y2="486"/>
    <line x1="520" y1="122" x2="520" y2="492" stroke="#8999ad" stroke-width="2"/>
    <line x1="640" y1="128" x2="640" y2="486"/><line x1="760" y1="128" x2="760" y2="486"/>
  </g>
  <g fill="#4a5d75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="280" y="511">−0.4</text><text x="400" y="511">−0.2</text>
    <text x="520" y="511">0</text><text x="640" y="511">+0.2</text><text x="760" y="511">+0.4</text>
  </g>
  <g fill="#344b68" font-family="Arial, sans-serif" font-size="13">
    <text x="60" y="151">B</text><text x="60" y="181">E</text><text x="60" y="211">G</text>
    <text x="60" y="241">K</text><text x="60" y="271">M</text><text x="60" y="301">D</text>
    <text x="60" y="331">L</text><text x="60" y="361">J</text><text x="60" y="391">A</text>
    <text x="60" y="421">N</text><text x="60" y="461">Spring</text><text x="60" y="491">Winter</text>
  </g>
  <g fill="#4d78d0">
    <rect x="296.8" y="139" width="223.2" height="16" rx="4"/>
    <rect x="315.8" y="169" width="204.2" height="16" rx="4"/>
    <rect x="370.6" y="199" width="149.4" height="16" rx="4"/>
    <rect x="520" y="229" width="146.4" height="16" rx="4"/>
    <rect x="520" y="259" width="142.2" height="16" rx="4"/>
    <rect x="520" y="289" width="71.6" height="16" rx="4"/>
    <rect x="520" y="319" width="69.2" height="16" rx="4"/>
    <rect x="520" y="349" width="66.5" height="16" rx="4"/>
    <rect x="520" y="379" width="64.1" height="16" rx="4"/>
    <rect x="520" y="409" width="46.1" height="16" rx="4"/>
  </g>
  <g fill="#27a38a">
    <rect x="503.3" y="449" width="16.7" height="16" rx="4"/>
    <rect x="520" y="479" width="15.6" height="16" rx="4"/>
  </g>
  <g fill="#344b68" font-family="Arial, sans-serif" font-size="12">
    <text x="288" y="152" text-anchor="end">−0.372</text><text x="307" y="182" text-anchor="end">−0.340</text>
    <text x="362" y="212" text-anchor="end">−0.249</text><text x="674" y="242">+0.244</text>
    <text x="670" y="272">+0.237</text><text x="600" y="302">+0.119</text>
    <text x="598" y="332">+0.115</text><text x="595" y="362">+0.111</text>
    <text x="592" y="392">+0.107</text><text x="574" y="422">+0.077</text>
    <text x="493" y="462" text-anchor="end">−0.028</text><text x="543" y="492">+0.026</text>
  </g>
  <text x="56" y="546" fill="#8290a1" font-family="Arial, sans-serif" font-size="12">Selected terms only; coefficients describe model associations, not causal effects or raw average demand.</text>
</svg>
