<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">LASSO held-out evaluation metrics</title>
  <desc id="desc">Saved test-set evaluation for the LASSO model reports R squared 0.8407, mean absolute error 4.1205 seats, and root mean squared error 8.9044 seats.</desc>
  <rect width="1000" height="390" rx="18" fill="#f5f8fc"/>
  <text x="56" y="54" fill="#162b49" font-family="Arial, sans-serif" font-size="26" font-weight="700">LASSO · held-out test results</text>
  <text x="56" y="84" fill="#62738a" font-family="Arial, sans-serif" font-size="15">Saved evaluation on the original seat-count scale (naive inverse transform)</text>
  <g>
    <rect x="56" y="118" width="274" height="206" rx="14" fill="#ffffff" stroke="#e0e7f0"/>
    <rect x="363" y="118" width="274" height="206" rx="14" fill="#ffffff" stroke="#e0e7f0"/>
    <rect x="670" y="118" width="274" height="206" rx="14" fill="#ffffff" stroke="#e0e7f0"/>
  </g>
  <text x="82" y="158" fill="#62738a" font-family="Arial, sans-serif" font-size="14" font-weight="700">R² · TEST</text>
  <text x="82" y="220" fill="#162b49" font-family="Arial, sans-serif" font-size="43" font-weight="700">0.841</text>
  <rect x="82" y="250" width="218" height="12" rx="6" fill="#e5ebf3"/>
  <rect x="82" y="250" width="183.3" height="12" rx="6" fill="#4d78d0"/>
  <text x="82" y="291" fill="#62738a" font-family="Arial, sans-serif" font-size="13">Reported R² on held-out data</text>
  <text x="389" y="158" fill="#62738a" font-family="Arial, sans-serif" font-size="14" font-weight="700">MAE · SEATS</text>
  <text x="389" y="220" fill="#162b49" font-family="Arial, sans-serif" font-size="43" font-weight="700">4.12</text>
  <text x="389" y="263" fill="#62738a" font-family="Arial, sans-serif" font-size="13">Mean absolute error</text>
  <text x="389" y="286" fill="#62738a" font-family="Arial, sans-serif" font-size="13">on the original count scale</text>
  <text x="696" y="158" fill="#62738a" font-family="Arial, sans-serif" font-size="14" font-weight="700">RMSE · SEATS</text>
  <text x="696" y="220" fill="#162b49" font-family="Arial, sans-serif" font-size="43" font-weight="700">8.90</text>
  <text x="696" y="263" fill="#62738a" font-family="Arial, sans-serif" font-size="13">Root mean squared error</text>
  <text x="696" y="286" fill="#62738a" font-family="Arial, sans-serif" font-size="13">penalizes larger misses more</text>
  <text x="56" y="359" fill="#8290a1" font-family="Arial, sans-serif" font-size="12">Values transcribed from the saved LASSO test evaluation; model methodology unchanged.</text>
</svg>
